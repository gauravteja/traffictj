name: Deploy to Cloudflare

on:
  push:
    branches: [main]

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Worker API
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: api

  deploy-admin-form:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy admin form to Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy admin-form --project-name=traffic-admin-form

  # Client-testable web preview of the mobile app, via Expo's web
  # target (react-native-web) exported as a static site. This is NOT
  # the real mobile app experience (no native WebView, no push
  # notifications) - it's a browser-testable stand-in so the app can
  # be shared with a link before there's a phone build to install.
  deploy-mobile-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: mobile-app
        run: npm ci
      - name: Export web build
        working-directory: mobile-app
        run: npx expo export -p web
      # `pages deploy` fails with "Project not found" if the project
      # doesn't exist yet - unlike `wrangler deploy` for Workers,
      # Pages projects aren't created implicitly by deploying to them.
      # This step only matters on the very first run; every run after
      # that, the project already exists and this step just fails
      # harmlessly (continue-on-error), which is fine since it does
      # nothing else.
      - name: Ensure Cloudflare Pages project exists
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages project create traffic-wedge-web --production-branch=main
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy mobile-app/dist --project-name=traffic-wedge-web
